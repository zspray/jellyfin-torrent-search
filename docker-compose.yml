version: '3.8'

services:
  jellyfin-torrent-search:
    build: .
    container_name: jellyfin-torrent-search
    restart: unless-stopped
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - media

  # Caso queira subir o Jackett junto (opcional)
  # jackett:
  #   image: lscr.io/linuxserver/jackett:latest
  #   container_name: jackett
  #   restart: unless-stopped
  #   ports:
  #     - "9117:9117"
  #   volumes:
  #     - ./data/jackett:/config
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #   networks:
  #     - media

networks:
  media:
    driver: bridge
